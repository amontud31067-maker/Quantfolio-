<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="qf-logo-frame" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C6B4E"/>
      <stop offset="48%" stop-color="#0D4B4F"/>
      <stop offset="100%" stop-color="#084E3A"/>
    </linearGradient>
    <linearGradient id="qf-logo-bg" x1="6" y1="6" x2="66" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172236"/>
      <stop offset="55%" stop-color="#0E1525"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="qf-logo-sheen" cx="78%" cy="18%" r="64%">
      <stop offset="0%" stop-color="#00E593" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00D084" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qf-logo-bar-1" x1="0" y1="40.5" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#066D4B" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="qf-logo-bar-2" x1="0" y1="32.5" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22E59B" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#00A86B" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="qf-logo-bar-3" x1="0" y1="24.5" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#68FBC1"/>
      <stop offset="100%" stop-color="#00C47C"/>
    </linearGradient>
    <linearGradient id="qf-logo-line" x1="19" y1="35.2" x2="52" y2="16.6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2CE09B"/>
      <stop offset="60%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Outer Emerald-Teal Glow Frame -->
  <rect x="1" y="1" width="70" height="70" rx="22" fill="url(#qf-logo-frame)" stroke="#00D084" stroke-opacity="0.46" stroke-width="1.4"/>

  <!-- Inner Obsidian Squircle Surface -->
  <rect x="5" y="5" width="62" height="62" rx="17" fill="url(#qf-logo-bg)"/>
  <rect x="5" y="5" width="62" height="62" rx="17" fill="url(#qf-logo-sheen)"/>
  <rect x="5.8" y="5.8" width="60.4" height="60.4" rx="16.2" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Baseline -->
  <line x1="16.5" y1="54.8" x2="55.5" y2="54.8" stroke="#94A3B8" stroke-opacity="0.34" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Ascending Quantitative Bars -->
  <rect x="19" y="40.5" width="7.8" height="13.5" rx="3.2" fill="url(#qf-logo-bar-1)"/>
  <rect x="32.1" y="32.5" width="7.8" height="21.5" rx="3.2" fill="url(#qf-logo-bar-2)"/>
  <rect x="45.2" y="24.5" width="7.8" height="29.5" rx="3.2" fill="url(#qf-logo-bar-3)"/>

  <!-- Rising Growth Curve & Luminous Target Point -->
  <path d="M19 35.2 C25.8 33.2 31 26.8 37 25.6 C43 24.4 47.2 19.8 52 16.6" stroke="url(#qf-logo-line)" stroke-width="2.7" stroke-linecap="round"/>
  <circle cx="52" cy="16.6" r="5.6" fill="#00D084" fill-opacity="0.30"/>
  <circle cx="52" cy="16.6" r="3.2" fill="#00F59B"/>
</svg>
